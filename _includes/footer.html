<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>
  <div class="footer-inner">
    <p class="footer-note">You can take the sysadmin out of the scheme, but you can't take the scheme out the sysadmin.</p>
    <nav class="footer-links" aria-label="Social and site links">
      <a href="{{ site.social.github }}">GitHub</a>
      <a href="{{ site.social.bluesky }}">Bluesky</a>
      <a href="{{ 'feed.xml' | relative_url }}">RSS feed</a>
    </nav>
    <p class="footer-credit">{{ site.title | escape }} <span aria-hidden="true">/</span> {{ 'now' | date: '%Y' }}</p>
  </div>
</footer>
