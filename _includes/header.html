<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <div class="site-header-inner">
    <a class="site-brand" rel="home" href="{{ '/' | relative_url }}">
      <span class="site-brand-mark" aria-hidden="true">PS&gt;</span>
      <span>{{ site.title | escape }}</span>
    </a>
    <nav class="site-nav nav-links" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/projects.html' | relative_url }}"{% if page.url contains 'projects' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/about.html' | relative_url }}"{% if page.url contains 'about' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/archive.html' | relative_url }}"{% if page.url contains 'archive' %} aria-current="page"{% endif %}>Notes / Blog</a>
    </nav>
    <div class="theme-picker" role="group" aria-label="Color theme">
      <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
      <button type="button" data-theme-choice="dark" aria-pressed="true">Dark</button>
      <button type="button" data-theme-choice="cyberpunk" aria-pressed="false">Cyberpunk</button>
    </div>
  </div>
</header>
